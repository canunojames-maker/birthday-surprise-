<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🌸</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff7fa;
    font-family: Georgia, serif;
}

.scene {
    width: 100%;
    text-align: center;
}

.bouquet {
    position: relative;
    width: 280px;
    height: 360px;
    margin: auto;
}

/* Flowers */
.flower {
    position: absolute;
    left: 50%;
    width: 70px;
    height: 70px;
    transform: translateX(-50%) scale(0);
    animation: bloom 1.3s ease forwards;
    z-index: 3;
}

.flower:nth-child(1) {
    margin-left: -85px;
    bottom: 135px;
    animation-delay: .3s;
}

.flower:nth-child(2) {
    margin-left: 0;
    bottom: 165px;
    animation-delay: .7s;
}

.flower:nth-child(3) {
    margin-left: 85px;
    bottom: 135px;
    animation-delay: 1.1s;
}

.flower:nth-child(4) {
    margin-left: -42px;
    bottom: 205px;
    animation-delay: 1.5s;
}

.flower:nth-child(5) {
    margin-left: 42px;
    bottom: 205px;
    animation-delay: 1.9s;
}

.petal {
    position: absolute;
    width: 34px;
    height: 47px;
    left: 18px;
    top: 10px;
    background: #f49ab8;
    border-radius: 50%;
    transform-origin: center 25px;
}

.petal:nth-child(1) {
    transform: rotate(0deg) translateY(-18px);
}

.petal:nth-child(2) {
    transform: rotate(72deg) translateY(-18px);
}

.petal:nth-child(3) {
    transform: rotate(144deg) translateY(-18px);
}

.petal:nth-child(4) {
    transform: rotate(216deg) translateY(-18px);
}

.petal:nth-child(5) {
    transform: rotate(288deg) translateY(-18px);
}

.center {
    position: absolute;
    width: 20px;
    height: 20px;
    left: 25px;
    top: 25px;
    background: #ffd76b;
    border-radius: 50%;
    z-index: 2;
}

/* Bouquet wrapping */
.paper {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 190px;
    height: 155px;
    background: #f7bfd0;
    transform: translateX(-50%) rotate(45deg);
    border-radius: 8px;
    z-index: 1;
    animation: paper 2s ease forwards;
}

.ribbon {
    position: absolute;
    left: 50%;
    bottom: 25px;
    width: 22px;
    height: 55px;
    background: #e78aa8;
    transform: translateX(-50%);
    border-radius: 5px;
    z-index: 4;
}

/* Birthday text */
.message {
    opacity: 0;
    transform: translateY(20px);
    animation: appear 2s ease forwards;
    animation-delay: 3.5s;
}

h1 {
    margin: 10px 0 5px;
    color: #e78aa8;
    font-size: 38px;
    font-weight: normal;
}

p {
    margin: 0;
    color: #9d6b7b;
    font-size: 16px;
}

/* Animations */
@keyframes bloom {
    0% {
        transform: translateX(-50%) scale(0);
    }

    70% {
        transform: translateX(-50%) scale(1.15);
    }

    100% {
        transform: translateX(-50%) scale(1);
    }
}

@keyframes paper {
    from {
        opacity: 0;
        transform: translateX(-50%) rotate(45deg) scale(.7);
    }

    to {
        opacity: 1;
        transform: translateX(-50%) rotate(45deg) scale(1);
    }
}

@keyframes appear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="bouquet">

        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
        </div>

        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
        </div>

        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
        </div>

        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
        </div>

        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
        </div>

        <div class="paper"></div>
        <div class="ribbon"></div>

    </div>

    <div class="message">
        <h1>Happy Birthday 🌸</h1>
        <p>Wishing you a beautiful day.</p>
    </div>

</div>

</body>
</html>
